<!doctype html><html><head><meta charset="utf-8"><title>Bao authoring review</title><style>body{margin:0;background:#f4efe3;color:#263d34;font:16px system-ui}canvas{display:block}aside{position:absolute;top:12px;left:12px;padding:12px;background:#fff9;border-radius:8px}button{margin:4px}</style></head><body><aside>Bao · Meshy A · authoring poses · ticket 24<br><span id=pose-label>Idle · authoring</span><br><button onclick="review.pose('idle')">Idle</button><button onclick="review.pose('sit')">Sit</button><button onclick="review.pose('walk')">Walk</button><button onclick="review.pose('greeting')">Wave</button><button onclick="review.theme('dark')">Dark</button><button onclick="review.theme('light')">Light</button></aside><script type="module">
import * as T from 'three';
import { loadModel, loadManifest } from '../../src/scene/meshy/assets.mjs';
import { createPandaAppearanceFactory } from '../../src/scene/meshy/panda-appearance.mjs';
import { createLeisureGesture } from '../../src/scene/meshy/leisure-gesture.mjs';
const renderer = new T.WebGLRenderer({antialias:true,alpha:true});renderer.setSize(1024,768);renderer.setPixelRatio(1);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.body.append(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color('#f4efe3');
const hemi=new T.HemisphereLight('#fff8ec','#b1c8b6',1.8);scene.add(hemi);
const light=new T.DirectionalLight('#fff5e6',2.3);light.position.set(-3,5,6);scene.add(light);
const fill=new T.DirectionalLight('#e4f1ff',.8);fill.position.set(3,3,3);scene.add(fill);
const camera=new T.PerspectiveCamera(32,1024/768,.1,100);camera.position.set(4,3.2,8);camera.lookAt(0,1.5,0);
const assets=await loadManifest(),body=await loadModel(assets.bao.url),bao=await loadModel(assets['characters.bao'].url);
const factory=createPandaAppearanceFactory({body,characters:{bao}}),panda=factory.createPanda('orchestrator');panda.model.scale.setScalar(1);scene.add(panda.model);const gesture=createLeisureGesture(panda.rig);
globalThis.review={panda,renderer,scene,camera,pose(kind,time=1.2){document.getElementById('pose-label').textContent=kind==='sit'?'Sit · authoring only; Bao stands in the den':kind+' · authoring';if(kind==='sit')panda.rig.poseSit(time);else if(kind==='walk')panda.rig.poseWaddle(time);else {panda.rig.poseIdle(time);gesture.pose(kind==='greeting'?'greeting':null,time);}renderer.render(scene,camera);},theme(theme){const dark=theme==='dark';scene.background.set(dark?'#202d30':'#f4efe3');hemi.intensity=dark?1.1:1.8;light.intensity=dark?1.5:2.3;renderer.render(scene,camera);},portrait(){const old={position:camera.position.clone(),quaternion:camera.quaternion.clone(),background:scene.background};const c=new T.OrthographicCamera(-1.05,1.05,1.05,-1.05,.1,20);c.position.set(0,2.12,6);c.lookAt(0,2.12,0);scene.background=null;renderer.setSize(512,512);panda.rig.poseIdle(0);renderer.render(scene,c);const data=renderer.domElement.toDataURL('image/webp',.92);renderer.setSize(1024,768);scene.background=old.background;renderer.render(scene,camera);return data;}};review.pose('idle',0);globalThis.ready=true;
</script></body></html>
