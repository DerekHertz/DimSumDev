name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    # Ubuntu 26.04's bwrap AppArmor profile strips capabilities from nested sandboxes.
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # ci-cd/07: everything except the browser files (see scripts/test-split.mjs)
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install sandbox host prerequisites
        timeout-minutes: 3
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap dbus-user-session
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
      - name: Require the enforced sandbox host
        timeout-minutes: 1
        run: |
          node --input-type=module <<'JS'
          import { createResourceLauncher } from './apps/bridge/agents/resource-group.mjs';
          const result = await createResourceLauncher({ slice: 'den-ci-preflight' }).preflight();
          if (!result.ok) throw new Error('CI cannot exercise the sandbox tests: ' + result.reason);
          JS
      - name: Run tests (everything but the browser files, plus the BOM check)
        run: npm run test:rest

  test-browser:
    name: test-browser
    runs-on: ubuntu-latest
    timeout-minutes: 15 # ci-cd/07: the browser files (smoke tests included), in parallel with `test`
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Read Playwright version
        id: pw-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      # organism-infra/183: the old install form that also ran apt-get hung for the whole
      # job timeout on PR #179. ubuntu-latest ships Chrome, which the smoke check tries first,
      # so this is only the fallback browser: no apt, a hard per-attempt timeout, one retry.
      - name: Install Playwright's Chromium (smoke check's fallback browser)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: |
          for attempt in 1 2; do
            timeout -k 10 180 npx playwright install chromium && exit 0
            echo "playwright install attempt $attempt failed or timed out"
          done
          exit 1
      - name: Run browser tests
        run: npm run test:browser

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # gitleaks-action calls GET /pulls/{n}/commits on pull_request events; without
      # this the call 403s ("Resource not accessible by integration", header
      # x-accepted-github-permissions: pull_requests=read) before any scanning
      # happens. Confirmed in CI run 36376905451 -- not a leaked secret finding.
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high
